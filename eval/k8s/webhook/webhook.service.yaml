# In-cluster variant for hosted clusters: clientConfig.service instead of url.
# caBundle matches Secret tei-webhook-tls (SAN tei-webhook.tei-lab.svc).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: tei-evidence
webhooks:
  - name: tei.lab.evidence
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        namespace: tei-lab
        name: tei-webhook
        path: /admit
        port: 443
      caBundle: 
    rules:
      - apiGroups: ["tei.lab"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["approvals", "isolates", "networkpolicies"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["clusterroles"]
    timeoutSeconds: 5
