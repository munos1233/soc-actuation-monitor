\* BindRecompute / EgressWitness / VerifySplit; AttributeOnly=FALSE).
\* Same constants as tei.cfg. Interface completeness for this CloseOK:
\* reading S => InvClose / InvBind hold on the finite slice.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT InvClose
INVARIANT InvBind
INVARIANT InvEgress
INVARIANT InvRole
INVARIANT InvVerify
INVARIANT InvHead
INVARIANT InvK8sClose
INVARIANT InvCASStatusLayer
CONSTANTS
  CloseRebuild = TRUE
  BindRecompute = TRUE
  VerifySplit = TRUE
  EgressWitness = TRUE
  RoleRevoke = TRUE
  HeadUnique = TRUE
  ClaimCAS = TRUE
  AttributeOnly = FALSE
CHECK_DEADLOCK FALSE
